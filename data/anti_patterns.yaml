# M6 伪框架黑名单 — 听起来专业、实则不可证伪的裸表述
# 规则：pattern 命中即计数；同一 pattern ≥2 次或合计 ≥3 次 → Gate 拦截。
# 正当用法：短语后 80 字内出现量化证据（数字+%）则不算（检查器负责窗口判断）。

- name: 长期看好(无量化)
  regex: '长期(?:看|被)?好(?:逻辑|前景|空间)?(?![^。\n]{0,80}\d)'
- name: 竞争壁垒深厚(无量化)
  regex: '(?:竞争)?壁垒(?:深厚|高|坚固)(?![^。\n]{0,80}\d)'
- name: 护城河稳固(无量化)
  regex: '护城河(?:稳固|深厚|宽阔)?(?![^。\n]{0,80}\d)'
- name: 竞争格局优化(无量化)
  regex: '竞争格局(?:持续)?优化(?![^。\n]{0,80}\d)'
- name: 显著提升(无量化)
  regex: '(?:显著|大幅)提升(?![^。\n]{0,60}(?:\d|%))'
- name: 空间广阔(无量化)
  regex: '(?:市场|成长)空间(?:广阔|巨大|可观)(?![^。\n]{0,80}\d)'
