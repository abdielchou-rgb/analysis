[build-system]
requires = ["setuptools>=68.0"]
# R78（2026-08-05 P0-3）：修正非标准 build-backend，标准 setuptools
build-backend = "setuptools.build_meta"

[project]
name = "2hao-analyst"
version = "0.1.0"
description = "二号分析师 — AI驱动的深度研究报告生成引擎"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "python-pptx>=0.6.21",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "openpyxl>=3.1.2",
    "Pillow>=10.0.0",
    "fpdf2>=2.7.0",
    "akshare>=1.14.0",
    "openai>=1.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# P3-audit: 仓库根 .ruff_cache 写入被拒（权限）→ 指到用户可写临时区
cache-dir = "D:/Temp/opencode/ruff_cache"
# 冻结归档区（V50~V56 数据平台）整体排除在 lint/format 之外
extend-exclude = ["legacy"]

[tool.ruff.lint]
# P3-audit 2026-08-24 校准：钩子首次真实通电，规则集与 9.4 万行存量对齐。
# 保留核心正确性规则（E4/E7/E9/F/W/I），豁免两类：
#   存量风格族：N806/N811/N817 命名、E741 歧义名、UP 现代化改写、
#              S1xx/S3xx bandit 信息项、F405 star-import、F841 弃值赋值
#   （渐进恢复：每清零一个目录就把对应码移回 select）
select = ["E4", "E7", "E9", "F", "W", "I"]
ignore = ["E501", "E402", "E701", "E702",
          "N806", "N811", "N817", "E741",
          "S101", "S110", "S112", "S324", "S603", "S607", "S608", "S310", "S311", "S108",
          "UP031", "UP035", "UP042", "UP045",
          "F405", "F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "E402"]
# P3-audit: legacy/ 为冻结归档（V50~V56 数据平台），不参与 lint 门禁
"legacy/**" = ["E", "F", "W", "I", "N", "UP", "S"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
# P1-audit 2026-08-24: marker 注册（此前 0 注册、0 timeout、0 coverage）
markers = [
    "unit: 纯离线单元测试",
    "integration: 跨模块集成测试（仍离线）",
    "e2e: 端到端管线测试",
    "network: 需要真实网络/LLM key 的测试",
    "golden: 黄金样本回归评估",
    "slow: 慢速测试",
]
timeout = 300
[tool.coverage.run]
source = ["pipeline", "core", "export", "harness", "utils"]
omit = ["*/__pycache__/*", "temp/*"]
