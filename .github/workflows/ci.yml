name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run lint (ruff)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check . --ignore=E501,W503,F601

      - name: Import check
        run: |
          python -c "from pipeline.e2e_orchestrator import E2EOrchestratorV2; print('Orchestrator OK')"
          python -c "from pipeline.section_writer import SectionWriter; print('SectionWriter OK')"
          python -c "from pipeline.data_collector import DataCollectorV5; print('DataCollector OK')"
