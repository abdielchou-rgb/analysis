name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run lint (ruff)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check . --ignore=E501,W503,F601

      - name: Import check
        run: |
          python -c "from pipeline.e2e_orchestrator import E2EOrchestratorV2; print('Orchestrator OK')"
          python -c "from pipeline.section_writer import SectionWriter; print('SectionWriter OK')"
          python -c "from pipeline.data_collector import DataCollectorV5; print('DataCollector OK')"
          python -c "from pipeline.checks.base import GateReport; print('GateReport OK')"
          python -c "from core.calibration.dashboard import CalibrationDashboard; print('CalibrationDashboard OK')"
          python -c "from core.significance import monte_carlo_direction_significance; print('Significance OK')"
          python -c "from core.cohort import LiveForwardCohort; print('Cohort OK')"
          python -c "from core.attribution import compute_ic; print('Attribution OK')"
          python -c "from core.prediction_timeline import PredictionTimeline; print('Timeline OK')"
          python -c "from core.hitl_durable import HITLApprovalManager; print('HITL OK')"
          python -c "from core.idempotent_ledger import IdempotentLedger; print('Ledger OK')"
          python -c "from core.retry_policy import RetryPolicy; print('RetryPolicy OK')"
          python -c "from core.dashboard import generate_dashboard; print('Dashboard OK')"
          python -c "from core.price_feeder import get_price; print('PriceFeeder OK')"

      - name: Run new tests
        run: |
          python -m pytest tests/test_price_feeder.py tests/test_significance_guard.py tests/test_argument_node_contract.py tests/test_placeholder_hard_block.py tests/test_golden_numeric.py -v --tb=short
