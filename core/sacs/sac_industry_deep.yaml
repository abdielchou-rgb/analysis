evidence_requirements:
  min_sources: 8
  primary_source_min: 3
  counter_evidence_required: true
forbidden_patterns:
- SAC
- 11维
- 范式路由
- 研究方法论
- AI生成
- AI辅助
- 本报告由系统生成
