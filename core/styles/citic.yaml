id: style_citic
name: 中信证券 Style
colors: {primary: '#8B0000', accent: '#D4A000'}
typography: {main_font: 'SimSun', heading_font: 'SimHei'}
writing:
  conclusion_first: true
  min_judgment_density: 1.2
  max_sentence_chars: 130
  forbidden_terms: ['值得注意的是', '从某种程度上说', '不可否认的是']
  signature_terms: ['我们认为', '我们判断', '核心风险在于']
  citation_style: inline
charts:
  preferred_types: ['bar_cluster', 'line', 'waterfall']
