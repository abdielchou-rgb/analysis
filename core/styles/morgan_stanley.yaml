id: style_morgan_stanley
name: Morgan Stanley Style (中文适配)
colors: {primary: "#003366", accent: "#FFFFFF", bg: "#FAFCFF", text: "#1A1A1A"}
typography: {main_font: "SimSun", heading_font: "SimHei"}
writing:
  conclusion_first: false
  min_judgment_density: 1.3
  max_sentence_chars: 120
  forbidden_terms: ["值得注意的是", "不可否认的是", "让我们一起看看"]
  citation_style: footnote_numbered
charts:
  preferred_types: ['line', 'bar_cluster', 'heatmap']
  colors: ['#003366', '#4CB8E8', '#B0D4E8']
