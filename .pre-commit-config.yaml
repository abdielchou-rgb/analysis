repos:
  # P3-audit 2026-08-24：ruff 改走 local hook（.venv 内单一工具源）。
  # 原 astral-sh 锁定 rev 与本地 ruff 版本偏差导致规则结果不一致。
  - repo: local
    hooks:
      - id: ruff-check-fix
        name: ruff (lint + fix staged)
        entry: .venv/Scripts/python.exe -m ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: .venv/Scripts/python.exe -m ruff format
        language: system
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # P3-audit 2026-08-24：本地钩子改用 .venv 解释器——系统 python 缺依赖会误报；
  # sdd-docs-sync 钩子退役：generate_claude_md() 是硬编码旧模板，与手写
  # CLAUDE.md 必然分叉（每次提交必败 → 门禁剧场）。
  # 待 generate_docs 改为从 iron_gate 注册表真实生成后再恢复。
  - repo: local
    hooks:
      - id: harness-validator
        name: Harness — Import Chain + Syntax + API Key Scan
        entry: .venv/Scripts/python.exe -m harness.validator
        language: system
        files: '\.py$'
        pass_filenames: false
        verbose: true

      - id: harness-p0-block
        name: Harness — P0 Block (entry point integrity)
        entry: .venv/Scripts/python.exe harness/p0_block.py
        language: system
        files: '^(pipeline/|core/|export/|main\.py)'
        pass_filenames: false
        verbose: true
