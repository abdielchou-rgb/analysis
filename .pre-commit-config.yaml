repos:
  # P3-audit 2026-08-24：ruff 改走 local hook（.venv 内单一工具源）。
  # 原 astral-sh 锁定 rev 与本地 ruff 版本偏差导致规则结果不一致。
  - repo: local
    hooks:
      - id: ruff-check-fix
        name: ruff (lint + fix staged)
        entry: .venv/Scripts/python.exe -m ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: .venv/Scripts/python.exe -m ruff format
        language: system
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # P3-audit 2026-08-24：SDD 治理闭环恢复——不再比对硬编码 CLAUDE.md，
  # 改为强制同步"从运行时代码生成的" docs/PIPELINE_FACTS.md（IronGate
  # 注册表/SAC 维度/Provider 表实时提取，改代码不改文档即被拦）。
  - repo: local
    hooks:
      - id: sdd-facts-sync
        name: SDD — PIPELINE_FACTS.md must match live code
        entry: .venv/Scripts/python.exe harness/sdd_facts_sync.py
        language: system
        files: '^(pipeline/checks/|pipeline/iron_gate\.py|core/sacs/|core/deepseek_client\.py|harness/(generate_docs|sdd_facts_sync)\.py|docs/PIPELINE_FACTS\.md)'
        pass_filenames: false
        verbose: true
  - repo: local
    hooks:
      - id: harness-validator
        name: Harness — Import Chain + Syntax + API Key Scan
        entry: .venv/Scripts/python.exe -m harness.validator
        language: system
        files: '\.py$'
        pass_filenames: false
        verbose: true

      - id: harness-p0-block
        name: Harness — P0 Block (entry point integrity)
        entry: .venv/Scripts/python.exe harness/p0_block.py
        language: system
        files: '^(pipeline/|core/|export/|main\.py)'
        pass_filenames: false
        verbose: true
